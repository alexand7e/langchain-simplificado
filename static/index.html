<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente Educacional</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .app { display: flex; gap: 1rem; width: min(1200px, 98vw); height: min(90vh, 750px); }
  .chat-panel {
    flex: 1; display: flex; flex-direction: column;
    background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    overflow: hidden;
  }
  .chat-panel header {
    padding: 1rem 1.25rem; background: #1a73e8; color: #fff;
    font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: .5rem;
  }
  .chat-panel header small { font-weight: 400; opacity: .8; font-size: .75rem; }
  .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
  .msg { max-width: 85%; padding: .7rem 1rem; border-radius: 12px; line-height: 1.45; font-size: .95rem; }
  .user { align-self: flex-end; background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #f1f3f5; color: #1a1a1a; border-bottom-left-radius: 4px; }
  .bot.loading { opacity: .6; }
  .bot .thinking { font-size: .8rem; color: #666; margin-top: .3rem; }
  .error { align-self: flex-start; background: #fff0f0; color: #c00; border: 1px solid #fcc; }
  .input-area { display: flex; gap: .5rem; padding: 1rem; border-top: 1px solid #e9ecef; }
  .input-area input {
    flex: 1; padding: .65rem 1rem; border: 1px solid #dee2e6; border-radius: 24px;
    font-size: .95rem; outline: none; transition: border .15s;
  }
  .input-area input:focus { border-color: #1a73e8; }
  .input-area button {
    padding: .65rem 1.25rem; background: #1a73e8; color: #fff; border: none;
    border-radius: 24px; font-size: .95rem; cursor: pointer; transition: background .15s;
  }
  .input-area button:hover { background: #1558b0; }
  .input-area button:disabled { background: #a0c4ff; cursor: not-allowed; }

  .persona-bar {
    display: flex; gap: .5rem; padding: .5rem 1rem;
    border-bottom: 1px solid #e9ecef; background: #fafbfc;
  }
  .persona-btn {
    padding: .3rem .7rem; border-radius: 16px; border: 1px solid #dee2e6;
    background: #fff; font-size: .8rem; cursor: pointer; transition: all .15s;
  }
  .persona-btn:hover { border-color: #1a73e8; color: #1a73e8; }
  .persona-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }

  .debug-panel {
    width: 400px; display: flex; flex-direction: column;
    background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    overflow: hidden;
  }
  .debug-panel header {
    padding: .85rem 1rem; background: #2d3748; color: #fff;
    font-weight: 600; font-size: .95rem;
  }
  .debug-content { flex: 1; overflow-y: auto; padding: .75rem; }
  .debug-content .empty {
    text-align: center; color: #999; font-size: .9rem; margin-top: 3rem;
  }
  .debug-step {
    padding: .6rem .75rem; margin-bottom: .5rem; border-radius: 8px;
    font-size: .85rem; border-left: 3px solid #1a73e8; background: #f8faff;
  }
  .debug-step .label { font-weight: 600; color: #2d3748; margin-bottom: .2rem; }
  .debug-step .value { color: #555; white-space: pre-wrap; word-break: break-word; font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: .8rem; }
  .debug-step.info { border-left-color: #1a73e8; }
  .debug-step.warn { border-left-color: #e8a71a; background: #fffcf0; }
  .debug-step.block { border-left-color: #e53e3e; background: #fff5f5; }
  .debug-step.pass { border-left-color: #38a169; background: #f0fff4; }
  .debug-step .collapse-btn {
    background: none; border: none; color: #1a73e8; cursor: pointer;
    font-size: .8rem; padding: 0; margin-top: .3rem;
  }
  .debug-step .collapsed { display: none; }

  @media (max-width: 768px) {
    .app { flex-direction: column; height: 95vh; }
    .debug-panel { width: 100%; max-height: 40vh; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="chat-panel">
    <header>
      <span>&#x1F916;</span> Agente Educacional
      <small>Piauí Para o Mundo</small>
    </header>
    <div class="persona-bar">
      <button class="persona-btn" data-persona="ensino_medio">Ensino M&#xe9;dio</button>
      <button class="persona-btn" data-persona="crianca">Crian&#xe7;a</button>
      <button class="persona-btn" data-persona="vestibular">Vestibular</button>
      <button class="persona-btn" data-persona="simples">Simples</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Pergunte algo sobre os dados do Piau&#xed;..." autofocus>
      <button id="sendBtn">Enviar</button>
    </div>
  </div>
  <div class="debug-panel" id="debugPanel">
    <header>&#x1F50D; Debug</header>
    <div class="debug-content" id="debugContent">
      <div class="empty">Clique em uma resposta do bot para ver os detalhes.</div>
    </div>
  </div>
</div>
<script>
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const messagesEl = document.getElementById('messages');
const debugContent = document.getElementById('debugContent');
let currentPersona = 'ensino_medio';
let debugHistory = {};

document.querySelectorAll('.persona-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.persona-btn.active')?.classList.remove('active');
    btn.classList.add('active');
    currentPersona = btn.dataset.persona;
  });
});
document.querySelector('.persona-btn[data-persona="ensino_medio"]').classList.add('active');

function addMessage(text, type, msgId) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  if (type === 'bot' && msgId) {
    div.dataset.msgId = msgId;
    div.style.cursor = 'pointer';
    div.title = 'Clique para ver detalhes';
    div.addEventListener('click', () => showDebug(msgId));
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showLoading() {
  const div = document.createElement('div');
  div.className = 'msg bot loading';
  div.id = 'loadingMsg';
  div.innerHTML = '<span class="thinking">&#x1F4AD; Pensando...</span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loadingMsg');
  if (el) el.remove();
}

function showDebug(msgId) {
  const info = debugHistory[msgId];
  if (!info) return;

  const steps = [];
  const iconMap = { info: '&#x2139;&#xFE0F;', warn: '&#x26A0;&#xFE0F;', block: '&#x26D4;', pass: '&#x2705;' };

  steps.push(`
    <div class="debug-step info">
      <div class="label">${iconMap.info} Pergunta</div>
      <div class="value">${escapeHtml(info.pergunta)}</div>
    </div>
  `);

  if (info.contexto) {
    const docs = info.contexto.split('\n\n');
    steps.push(`
      <div class="debug-step pass">
        <div class="label">${iconMap.pass} RAG &#x2014; ${docs.length} documento(s) encontrado(s)</div>
        <div class="value" id="ragValue">${escapeHtml(info.contexto)}</div>
        <button class="collapse-btn" onclick="toggleCollapse('ragValue', this)">${docs.length > 3 ? 'Mostrar mais' : ''}</button>
      </div>
    `);
    if (docs.length > 3) {
      steps.push(`<style>#ragValue { max-height: 4.5em; overflow: hidden; }</style>`);
    }
  } else {
    steps.push(`
      <div class="debug-step warn">
        <div class="label">${iconMap.warn} RAG &#x2014; Nenhum documento encontrado</div>
        <div class="value">Contexto vazio: o guardrail vai bloquear a resposta.</div>
      </div>
    `);
  }

  steps.push(`
    <div class="debug-step info">
      <div class="label">${iconMap.info} Persona</div>
      <div class="value">${escapeHtml(info.persona)}</div>
    </div>
  `);

  steps.push(`
    <div class="debug-step info">
      <div class="label">${iconMap.info} Prompt enviado ao LLM</div>
      <div class="value" id="promptValue">${escapeHtml(info.prompt_montado)}</div>
      <button class="collapse-btn" onclick="toggleCollapse('promptValue', this)">Mostrar mais</button>
    </div>
  `);

  steps.push(`
    <div class="debug-step info">
      <div class="label">${iconMap.info} Resposta bruta do LLM</div>
      <div class="value">${escapeHtml(info.resposta_bruta)}</div>
    </div>
  `);

  if (info.guardrail_aplicado) {
    steps.push(`
      <div class="debug-step block">
        <div class="label">${iconMap.block} Guardrail &#x2014; Resposta BLOQUEADA</div>
        <div class="value">Contexto vazio ou insuficiente. Resposta substitu&#xed;da pela mensagem padr&#xe3;o.</div>
      </div>
    `);
  } else {
    steps.push(`
      <div class="debug-step pass">
        <div class="label">${iconMap.pass} Guardrail &#x2014; Resposta aprovada</div>
        <div class="value">A resposta estava dentro do contexto das fontes.</div>
      </div>
    `);
  }

  steps.push(`
    <div class="debug-step pass">
      <div class="label">${iconMap.pass} Resposta final</div>
      <div class="value">${escapeHtml(info.resposta_final)}</div>
    </div>
  `);

  debugContent.innerHTML = steps.join('');
}

function toggleCollapse(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const isCollapsed = el.style.maxHeight !== '' && el.style.maxHeight !== 'none';
  el.style.maxHeight = isCollapsed ? 'none' : '4.5em';
  btn.textContent = isCollapsed ? 'Mostrar menos' : 'Mostrar mais';
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'user');
  showLoading();
  sendBtn.disabled = true;

  try {
    const res = await fetch('/chat/debug', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensagem: text, persona: currentPersona }),
    });
    if (!res.ok) throw new Error('Erro ' + res.status);
    const data = await res.json();
    removeLoading();
    const msgId = Date.now().toString();
    debugHistory[msgId] = data;
    addMessage(data.resposta_final, 'bot', msgId);
    showDebug(msgId);
  } catch (e) {
    removeLoading();
    addMessage('Erro ao conectar com o servidor: ' + e.message, 'error');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
